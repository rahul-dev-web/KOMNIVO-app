name: KOMNIVO Supabase Database Tests

concurrency:
  group: komnivo-supabase-db-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-db-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-db-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply all migrations to a clean database
        run: supabase db reset --local

      - name: Run pgTAP and RLS regression tests
        run: supabase test db
