name: KOMNIVO Web Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Android and Web scaffolding
        run: bash tool/bootstrap-platforms.sh

      - name: Resolve packages
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          flutter build web --release --base-href "/KOMNIVO-app/" \
            --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ vars.SUPABASE_PUBLISHABLE_KEY }}" \
            --dart-define=SUPABASE_REDIRECT_URL="${{ vars.SUPABASE_REDIRECT_URL }}" \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ vars.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ vars.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${{ vars.FIREBASE_STORAGE_BUCKET }}" \
            --dart-define=FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --dart-define=FIREBASE_VAPID_KEY="${{ vars.FIREBASE_VAPID_KEY }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
