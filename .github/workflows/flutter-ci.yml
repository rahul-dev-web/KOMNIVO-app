name: KOMNIVO Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and Web platform scaffolding
        run: bash tool/bootstrap-platforms.sh

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart (warnings and errors are fatal)
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Build Web release
        run: flutter build web --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: komnivo-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web/
          if-no-files-found: error
  windows-bootstrap:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Generate and verify native Windows scaffolding
        shell: pwsh
        run: .\tool\bootstrap-platforms.ps1

      - name: Resolve packages and analyze
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "flutter pub get failed." }
          flutter analyze --no-fatal-infos
          if ($LASTEXITCODE -ne 0) { throw "flutter analyze failed." }
