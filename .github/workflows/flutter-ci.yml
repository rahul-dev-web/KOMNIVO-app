name: KOMNIVO Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and Web platform scaffolding
        run: bash tool/bootstrap-platforms.sh

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Build Web release
        run: flutter build web --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: komnivo-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web/
          if-no-files-found: error
