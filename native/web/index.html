<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="KOMNIVO — gaming communities, teams and tournaments in one connected platform.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080B12">
  <title>KOMNIVO — Esports Community OS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="brand/komnivo-mark.svg">
  <link rel="preload" as="image" href="brand/komnivo-mark.svg" fetchpriority="high">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KOMNIVO">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/komnivo-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/komnivo-192.png">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #080B12;
    }

    #komnivo-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      background:
        radial-gradient(ellipse at 50% 40%, #18243C 0%, #0D1321 54%, #080B12 100%);
      opacity: 1;
      visibility: visible;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #komnivo-boot-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #komnivo-boot-splash .brand-mark {
      display: block;
      width: 112px;
      height: 112px;
      border-radius: 26px;
      animation: komnivo-mark-pulse 1.8s ease-in-out infinite;
    }

    #komnivo-boot-splash .brand-name {
      margin-top: 24px;
      font: 900 23px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 7px;
    }

    #komnivo-boot-splash .brand-tagline {
      margin-top: 12px;
      color: #55D6E8;
      font: 800 10px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 3px;
    }

    #komnivo-boot-splash .loading-track {
      width: 44px;
      height: 3px;
      margin-top: 30px;
      overflow: hidden;
      border-radius: 99px;
      background: #273449;
    }

    #komnivo-boot-splash .loading-track::after {
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #A68BFF, #55D6E8);
      content: "";
      animation: komnivo-loading 1.1s ease-in-out infinite;
    }

    @keyframes komnivo-mark-pulse {
      0%, 100% { opacity: .82; transform: scale(.98); }
      50% { opacity: 1; transform: scale(1); }
    }

    @keyframes komnivo-loading {
      from { transform: translateX(-110%); }
      to { transform: translateX(230%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #komnivo-boot-splash *,
      #komnivo-boot-splash *::after {
        animation: none !important;
      }
    }
  </style>
  <script>
    window.komnivoHideBootSplash = function () {
      var splash = document.getElementById("komnivo-boot-splash");
      if (!splash) return;
      splash.classList.add("is-hidden");
      window.setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 300);
    };
  </script>
</head>
<body>
  <div id="komnivo-boot-splash" role="status" aria-label="Loading KOMNIVO">
    <img class="brand-mark" src="brand/komnivo-mark.svg" alt="KOMNIVO">
    <div class="brand-name">KOMNIVO</div>
    <div class="brand-tagline">ESPORTS COMMUNITY OS</div>
    <div class="loading-track" aria-hidden="true"></div>
  </div>
  <noscript>KOMNIVO requires JavaScript to start.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
